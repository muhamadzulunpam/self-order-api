        has_spice_level: { type: boolean }

    PublicCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        menus:
          type: array
          items: { $ref: '#/components/schemas/PublicMenu' }

    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        customer_name: { type: string, maxLength: 100, nullable: true }
        notes: { type: string, maxLength: 500, nullable: true }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [menu_id, quantity]
            properties:
              menu_id: { type: integer }
              quantity: { type: integer, minimum: 1, maximum: 20 }
              spice_level:
                type: integer
                minimum: 0
                maximum: 5
                description: Wajib untuk menu yang punya level pedas
              notes: { type: string, maxLength: 255, nullable: true }
      example:
        customer_name: Budi
        notes: Tanpa sambal tambahan
        items:
          - { menu_id: 1, quantity: 2, spice_level: 3 }
          - { menu_id: 7, quantity: 1, notes: Es sedikit }

    PublicOrder:
      type: object
